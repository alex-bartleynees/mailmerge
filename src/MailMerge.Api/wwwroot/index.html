<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MailMerge</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1f2328;--mute:#6b7280;--line:#e3e1db;--brand:#1f6f5c;--brand-ink:#fff;--bad:#b42318;--badbg:#fdecea;--warn:#8a5a00;--warnbg:#fff4d6;--ok:#14663f;--okbg:#e3f5ea;--radius:10px}
@media (prefers-color-scheme:dark){:root{--bg:#16181a;--card:#1f2326;--ink:#e8eaec;--mute:#9aa3ab;--line:#33393e;--brand:#3fa88e;--brand-ink:#0b1512;--bad:#ff8f84;--badbg:#3a1f1c;--warn:#f0c36a;--warnbg:#3a2f14;--ok:#7bd8a4;--okbg:#17301f}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0;letter-spacing:.2px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 14px;border-radius:8px;font:inherit;color:var(--mute);cursor:pointer}
nav button.on{background:var(--brand);color:var(--brand-ink)}
#who{margin-left:auto;display:flex;gap:10px;align-items:center}
main{max-width:1200px;margin:0 auto;padding:18px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.right{margin-left:auto}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
label.inline{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input[type=checkbox]{width:auto}
textarea{min-height:90px;resize:vertical}
.footer-editor{min-height:90px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
button.btn,a.btn{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-block}
button.btn:hover,a.btn:hover{border-color:var(--brand)}
button.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
.mute{color:var(--mute)}.small{font-size:13px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;background:var(--bg);border:1px solid var(--line)}
.pill.ok{background:var(--okbg);color:var(--ok);border-color:transparent}.pill.bad{background:var(--badbg);color:var(--bad);border-color:transparent}.pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.note{padding:10px 12px;border-radius:8px;background:var(--warnbg);color:var(--warn);margin:10px 0}
.note.bad{background:var(--badbg);color:var(--bad)}.note.ok{background:var(--okbg);color:var(--ok)}
.gridwrap{overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:0;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--card);font-size:12px;color:var(--mute);padding:8px;z-index:1}
td input{border:0;border-radius:0;background:transparent;min-width:130px;padding:7px 8px}
td input:focus{background:var(--bg);outline:2px solid var(--brand);outline-offset:-2px}
td.pad{padding:6px 8px}
tr.off td input{opacity:.45}
td input.badv{background:var(--badbg);color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px dashed var(--brand);color:var(--brand);background:none;border-radius:99px;padding:2px 10px;font-size:13px;cursor:pointer}
.tools{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}.tools button{padding:4px 10px}
#editor{min-height:220px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);overflow:auto}
.bodybox textarea{min-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.bar-progress{height:10px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar-progress i{display:block;height:100%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:20}
.modal.hidden{display:none}.box{background:var(--card);border-radius:12px;padding:20px;max-width:900px;width:100%;border:1px solid var(--line)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:8px;align-items:center}
#toast div{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:90vw}
#toast div.bad{background:var(--bad);color:#fff}
iframe{width:100%;height:320px;border:1px solid var(--line);border-radius:8px;background:#fff}
.stat{padding:8px 14px;border-radius:8px;background:var(--bg);border:1px solid var(--line);text-align:center;min-width:84px}
.stat b{display:block;font-size:20px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.cols2{grid-template-columns:1fr}}
code{background:var(--bg);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header><div class="bar"><h1>✉ MailMerge</h1>
<nav id="tabs"></nav><div id="who" class="small mute"></div></div></header>
<main id="app"></main>
<div id="modal" class="modal hidden"><div class="box" id="box"></div></div>
<div id="toast"></div>

<script>
const $=(s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---- BFF plumbing: the session is a cookie; state-changing calls need the CSRF header. */
let csrf=null;
async function csrfToken(){
  if(csrf!==null)return csrf;
  try{const r=await fetch('/bff/antiforgery',{credentials:'same-origin'});csrf=r.ok?(await r.json()).requestToken:''}catch{csrf=''}
  return csrf;
}
async function api(method,url,body,form){
  const o={method,headers:{},credentials:'same-origin'};
  if(form)o.body=form; else if(body!==undefined){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}
  if(method!=='GET'){const t=await csrfToken();if(t)o.headers['X-CSRF-TOKEN']=t}
  const r=await fetch(url,o);
  if(r.status===401){location.href='/bff/login';throw new Error('Please sign in')}
  if(!r.ok){
    let m=r.statusText;
    try{const p=await r.json();m=p.detail||p.error||(p.errors&&Object.values(p.errors).flat()[0])||p.title||m}catch{}
    if(r.status===400&&/anti-?forgery/i.test(m))csrf=null;
    const e=new Error(m);e.status=r.status;throw e;
  }
  return (r.headers.get('content-type')||'').includes('json')?r.json():null;
}
async function signOut(){
  const t=await csrfToken();const f=document.createElement('form');f.method='POST';f.action='/bff/logout';
  const i=document.createElement('input');i.type='hidden';i.name='__RequestVerificationToken';i.value=t;f.append(i);document.body.append(f);f.submit();
}
function toast(msg,bad){const d=document.createElement('div');d.textContent=msg;if(bad)d.className='bad';$('#toast').append(d);setTimeout(()=>d.remove(),bad?7000:2800)}
const guard=fn=>async(...a)=>{try{return await fn(...a)}catch(e){toast(e.message,true)}};
function modal(html){$('#box').innerHTML=html;$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden');$('#box').innerHTML=''}
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
const fmtSize=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const fmtDate=s=>s?new Date(s).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'';
const debounce=(fn,ms)=>{let t;const d=(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)};return d};
const daysUntil=s=>Math.ceil((new Date(s)-Date.now())/86400000);

const TABS=[['emails','Emails'],['contacts','Contacts'],['accounts','Accounts'],['privacy','Opt-outs & privacy']];
let tab=location.hash.slice(1)||'emails', poller=null, WS=null;
function nav(t){tab=t;location.hash=t;clearInterval(poller);poller=null;draw()}
function draw(){
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" data-t="${k}">${l}</button>`).join('');
  $$('#tabs button').forEach(b=>b.onclick=()=>nav(b.dataset.t));
  ({emails:viewEmails,contacts:viewContacts,accounts:viewAccounts,privacy:viewPrivacy}[tab]||viewEmails)().catch(e=>toast(e.message,true));
}
async function start(){
  // Back from "Sign in with Microsoft": report the outcome, then tidy the address bar.
  const q=new URLSearchParams(location.search);
  if(q.get('microsoft')==='connected')toast('Signed in to Microsoft');
  if(q.get('microsoft')==='error')toast(q.get('message')||'Microsoft sign-in failed',true);
  if(q.has('microsoft'))history.replaceState(null,'',location.pathname+location.hash);
  try{WS=await api('GET','/api/workspace')}
  catch(e){
    if(e.status===403){$('#app').innerHTML=`<div class="card"><h2>No access yet</h2><p>${esc(e.message)}</p><button class="btn" id="so">Sign out</button></div>`;$('#so').onclick=signOut;return}
    throw e;
  }
  $('#who').innerHTML=`<span>${esc(WS.user.name||WS.user.email||'')} · <b>${esc(WS.workspace.name)}</b></span><button class="btn" id="so">Sign out</button>`;
  $('#so').onclick=signOut;
  draw();
}

/* ============================================================ ACCOUNTS */
const KIND={microsoft:'Outlook / Microsoft 365',smtp:'Other email (SMTP)',test:'Test mode'};
async function viewAccounts(){
  const accts=await api('GET','/api/accounts');
  $('#app').innerHTML=`
  <div class="card"><h2>Sending accounts</h2>
   <p class="mute small">An account is the mailbox your emails are sent from. Emails created here appear in that mailbox's <b>Drafts</b> and <b>Sent</b> folders, just like normal Outlook email.</p>
   ${accts.length?accts.map(a=>`<div class="card" data-id="${a.id}">
      <div class="row"><b>${esc(a.name)}</b>
       <span class="pill">${KIND[a.kind]}</span>
       ${a.kind==='microsoft'?(a.microsoftAccount?`<span class="pill ok">Signed in as ${esc(a.microsoftAccount)}</span>`:'<span class="pill warn">Not signed in</span>'):''}
       <span class="right row">
        ${a.kind==='microsoft'?`<button class="btn primary" data-a="login">${a.microsoftAccount?'Sign in again':'Sign in with Microsoft'}</button>`:''}
        ${a.kind==='microsoft'&&a.microsoftAccount?'<button class="btn" data-a="logout">Sign out</button>':''}
        ${a.kind==='test'?'<button class="btn" data-a="outbox">Test outbox</button>':''}
        <button class="btn" data-a="check">Test connection</button>
        <button class="btn" data-a="edit">Edit</button>
        <button class="btn danger" data-a="del">Remove</button></span></div>
      <div class="small mute">From: ${esc(a.fromEmail||'(set after sign-in)')} · up to ${a.perMinute} emails/minute${a.signedInBy?` · connected by ${esc(a.signedInBy)}`:''}</div>
      <div class="result"></div></div>`).join(''):'<div class="note">No accounts yet. Add one below to get started.</div>'}
   <div class="row"><button class="btn primary" id="addAcct">+ Add account</button></div>
  </div>`;
  $('#addAcct').onclick=()=>acctForm(null);
  $$('[data-id]').forEach(el=>{const a=accts.find(x=>x.id==el.dataset.id);
    el.onclick=guard(async e=>{const act=e.target.dataset.a;if(!act)return;const res=$('.result',el);
      if(act==='edit')return acctForm(a);
      if(act==='del'){if(confirm(`Remove "${a.name}"? Emails already sent stay in the mailbox.`)){await api('DELETE','/api/accounts/'+a.id);viewAccounts()}return}
      if(act==='check'){res.innerHTML='<div class="note">Checking…</div>';const r=await api('POST',`/api/accounts/${a.id}/check`);res.innerHTML=`<div class="note ${r.ok?'ok':'bad'}">${esc(r.message)}</div>`}
      if(act==='login'){const r=await api('POST',`/api/accounts/${a.id}/microsoft/sign-in`);location.href=r.authorizeUrl}
      if(act==='logout'){if(confirm('Sign this mailbox out? Emails using it will pause until someone signs in again.')){await api('POST',`/api/accounts/${a.id}/microsoft/sign-out`);viewAccounts()}}
      if(act==='outbox')showOutbox(a);
    })});
}
async function showOutbox(a){
  const o=await api('GET',`/api/accounts/${a.id}/test-outbox`);
  const rows=(items,folder)=>items.map(m=>`<tr><td class="pad">${folder}</td><td class="pad">${esc(m.to)}</td><td class="pad"><b>${esc(m.subject)}</b><div class="small mute" style="white-space:pre-wrap;max-width:520px">${esc(m.text.slice(0,300))}</div></td><td class="pad small">${m.attachments.map(esc).join(', ')}</td></tr>`).join('');
  modal(`<h2>Test outbox: ${esc(a.name)}</h2><p class="mute small">Nothing here was really sent. The outbox is cleared when the app restarts.</p>
   ${o.drafts.length+o.sent.length?`<div class="gridwrap"><table><thead><tr><th>Folder</th><th>To</th><th>Email</th><th>Attachments</th></tr></thead><tbody>${rows(o.drafts,'Drafts')}${rows(o.sent,'Sent')}</tbody></table></div>`:'<div class="note">Empty.</div>'}
   <div class="row" style="margin-top:14px"><button class="btn" onclick="closeModal()">Close</button></div>`);
}
function acctForm(a){
  const s=a?.smtp||{};const kind=a?.kind||'microsoft';
  modal(`<h2>${a?'Edit':'Add'} account</h2>
  <label>Name (for your reference)</label><input id="f_name" value="${esc(a?.name||'')}" placeholder="e.g. Sales mailbox">
  <label>Type</label><select id="f_kind" ${a?'disabled':''}>
    <option value="microsoft">Outlook / Microsoft 365 (this is the one for Outlook email)</option>
    <option value="smtp">Any other email (Gmail, your own domain…)</option>
    <option value="test">Test mode (nothing is really sent)</option></select>
  <div id="kindfields"></div>
  <label>Emails per minute <span class="mute">(a gentle pace avoids spam filters; 20 is a good start)</span></label>
  <input id="f_pm" type="number" min="1" max="120" value="${a?.perMinute||20}">
  <div class="row" style="margin-top:16px"><button class="btn primary" id="save">Save</button><button class="btn" onclick="closeModal()">Cancel</button></div>`);
  $('#f_kind').value=kind;
  const fields=()=>{const k=$('#f_kind').value;
    $('#kindfields').innerHTML=k==='microsoft'?`
      <div class="note ok">That's all we need. After saving, click <b>Sign in with Microsoft</b> and sign in with the shop's Outlook email address.</div>
      <p class="mute small">If Microsoft says <i>“Need admin approval”</i>, the shop owner (whoever manages the Microsoft 365 account) should sign in first and tick <i>“Consent on behalf of your organization”</i>.</p>`
    :k==='smtp'?`
      <div class="cols2"><div><label>Your email address</label><input id="f_from" value="${esc(a?.fromEmail||'')}"></div>
      <div><label>Display name (optional)</label><input id="f_fname" value="${esc(a?.fromName||'')}"></div></div>
      <div class="cols2"><div><label>SMTP server</label><input id="f_host" value="${esc(s.host||'')}" placeholder="smtp.example.com"></div>
      <div><label>Port</label><input id="f_port" type="number" value="${esc(s.port||587)}"></div></div>
      <label>Security</label><select id="f_sec"><option value="starttls">STARTTLS (587)</option><option value="ssl">SSL/TLS (465)</option><option value="none">None</option></select>
      <div class="cols2"><div><label>Username</label><input id="f_user" value="${esc(s.username||a?.fromEmail||'')}"></div>
      <div><label>Password / app password ${a?.hasPassword?'<span class="mute">(leave blank to keep)</span>':''}</label><input id="f_pw" type="password" autocomplete="new-password"></div></div>
      <h3>Optional: IMAP (lets drafts and Sent copies appear in the mailbox)</h3>
      <div class="cols2"><div><label>IMAP server</label><input id="f_ih" value="${esc(s.imapHost||'')}" placeholder="imap.example.com"></div>
      <div><label>IMAP port</label><input id="f_ip" type="number" value="${esc(s.imapPort||993)}"></div></div>
      <label>IMAP security</label><select id="f_isec"><option value="ssl">SSL/TLS (993)</option><option value="starttls">STARTTLS (143)</option><option value="none">None</option></select>
      <div class="cols2"><div><label>Drafts folder (blank = auto)</label><input id="f_df" value="${esc(s.draftsFolder||'')}"></div>
      <div><label>Sent folder (blank = auto)</label><input id="f_sf" value="${esc(s.sentFolder||'')}"></div></div>`
    :`<label>Pretend email address</label><input id="f_from" value="${esc(a?.fromEmail||'me@example.com')}">
      <p class="mute small">Test mode keeps each email in a test outbox instead of sending it. Good for practising. Addresses ending <code>@bounce.invalid</code> pretend to be rejected, and <code>@timeout.invalid</code> pretend the connection dropped.</p>`;
    if(k==='smtp'){$('#f_sec').value=s.security||'starttls';$('#f_isec').value=s.imapSecurity||'ssl'}};
  $('#f_kind').onchange=fields;fields();
  $('#save').onclick=guard(async()=>{const k=$('#f_kind').value;
    const body={name:$('#f_name').value,kind:k,perMinute:+$('#f_pm').value||20};
    if(k==='smtp')Object.assign(body,{fromEmail:$('#f_from').value.trim(),fromName:$('#f_fname').value.trim(),password:$('#f_pw').value,
      smtp:{host:$('#f_host').value.trim(),port:+$('#f_port').value||587,security:$('#f_sec').value,username:$('#f_user').value.trim(),
        imapHost:$('#f_ih').value.trim(),imapPort:+$('#f_ip').value||993,imapSecurity:$('#f_isec').value,draftsFolder:$('#f_df').value.trim(),sentFolder:$('#f_sf').value.trim()}});
    if(k==='test')body.fromEmail=$('#f_from').value.trim();
    await api(a?'PUT':'POST','/api/accounts'+(a?'/'+a.id:''),body);closeModal();viewAccounts()});
}

/* ============================================================ CONTACTS */
let CT={lists:[],cur:null,data:null,q:''};
async function viewContacts(){
  CT.lists=await api('GET','/api/lists');
  if(!CT.cur||!CT.lists.find(l=>l.id===CT.cur))CT.cur=CT.lists[0]?.id??null;
  $('#app').innerHTML=`<div class="card"><div class="row">
    <h2 style="margin:0">Contact lists</h2>
    <select id="listSel" style="width:auto;min-width:220px">${CT.lists.map(l=>`<option value="${l.id}" ${l.id===CT.cur?'selected':''}>${esc(l.name)} (${l.count})</option>`).join('')||'<option>No lists yet</option>'}</select>
    <button class="btn primary" id="imp">⬆ Upload Excel / CSV</button>
    <button class="btn" id="newList">+ Blank list</button>
    ${CT.cur?'<button class="btn" id="ren">Rename</button><button class="btn" id="exp">⬇ Download Excel</button><button class="btn danger" id="dl">Delete list</button>':''}
  </div></div><div id="grid"></div>`;
  $('#listSel').onchange=e=>{CT.cur=+e.target.value;viewContacts()};
  $('#imp').onclick=()=>pickFile('.xlsx,.xlsm,.csv,.tsv,.txt',guard(importFlow));
  $('#newList').onclick=guard(async()=>{const n=prompt('Name for the new list?');if(!n)return;const l=await api('POST','/api/lists',{name:n});CT.cur=l.id;viewContacts()});
  if(CT.cur){
    $('#ren').onclick=guard(async()=>{const n=prompt('New name?',CT.lists.find(l=>l.id===CT.cur).name);if(!n)return;await api('PUT','/api/lists/'+CT.cur,{name:n});viewContacts()});
    $('#exp').onclick=()=>location.href=`/api/lists/${CT.cur}/export`;
    $('#dl').onclick=guard(async()=>{if(confirm('Delete this whole list and its contacts? This cannot be undone.')){await api('DELETE','/api/lists/'+CT.cur);CT.cur=null;viewContacts()}});
    await loadGrid();
  }else $('#grid').innerHTML='<div class="note">Upload an Excel file of your clients to get started. The first row should be column headings (like Email, FirstName).</div>';
}
function pickFile(accept,cb){const i=document.createElement('input');i.type='file';i.accept=accept;i.onchange=()=>i.files[0]&&cb(i.files[0]);i.click()}
async function loadGrid(){CT.data=await api('GET',`/api/lists/${CT.cur}/contacts`);drawGrid()}
function drawGrid(){
  const d=CT.data,cols=d.columns,q=CT.q.toLowerCase();
  const all=d.contacts,list=q?all.filter(c=>Object.values(c.data).some(v=>String(v).toLowerCase().includes(q))):all;
  const shown=list.slice(0,300),bad=all.filter(c=>!c.valid).length,off=all.filter(c=>c.doNotEmail||c.optedOut).length;
  $('#grid').innerHTML=`<div class="card">
   <div class="row" style="margin-bottom:10px"><b>${esc(d.name)}</b><span class="mute small">${all.length} contacts</span>
    ${bad?`<span class="pill bad">${bad} invalid email${bad>1?'s':''}</span>`:''}${off?`<span class="pill warn">${off} won't be emailed</span>`:''}
    <input id="q" placeholder="Search…" value="${esc(CT.q)}" style="width:200px;margin-left:auto">
    <button class="btn" id="addCol">+ Column</button></div>
   <p class="mute small">To select recipients using values in your imported columns, open an email in <b>Emails</b> and set <b>Recipient rules</b> below its Send to list. People who don't match are skipped automatically for that email.</p>
   <div class="row" style="margin-bottom:10px"><input id="newEmail" placeholder="Add a person: email address" style="max-width:300px"><button class="btn primary" id="addRow">Add</button></div>
   <div class="gridwrap"><table><thead><tr><th>Don't email</th>${cols.map(c=>`<th>${esc(c)} ${c==='Email'?'':`<a href="#" data-del="${esc(c)}" title="Remove column" class="mute" style="text-decoration:none">✕</a>`}</th>`).join('')}<th></th></tr></thead>

  let isHtml=c.isHtml; fmt.value=isHtml?'1':'0';
  const showMode=()=>{plain.style.display=isHtml?'none':'';ed.style.display=isHtml?'':'none';tools.style.display=isHtml&&!locked?'flex':'none'};
  if(isHtml)ed.innerHTML=c.body;else plain.value=c.body;showMode();
  const getBody=()=>isHtml?ed.innerHTML:plain.value;
  // --- recipient filter
  const F={match:c.filter?.match||'all',conditions:(c.filter?.conditions||[]).map(x=>({...x}))};
  const filterCols=list?.columns||[];
  const newCondition=()=>({column:filterCols.find(k=>k!=='Email')||filterCols[0],operator:'isYes',value:''});
  let saving=false,serverFilterError=null,latestPlan=null;
  const complete=x=>x.column&&(!FILTER_NEEDS_VALUE.includes(x.operator)||(x.value||'').trim());
  const filterOut=()=>({match:F.match,conditions:F.conditions.map(x=>({...x}))});
  const filterIssue=()=>{
    if(F.conditions.length>10)return 'Use at most 10 recipient rules.';
    if(F.conditions.some(x=>!complete(x)))return 'Complete each recipient rule before saving or sending.';
    const missing=F.conditions.filter(x=>!filterCols.some(k=>k.toLowerCase()===x.column.toLowerCase())).map(x=>x.column);
    return missing.length?`These columns aren't in this list: ${missing.join(', ')}. Choose another column or remove the rule.`:'';
  };
  function updateFilterState(){
    const issue=filterIssue()||serverFilterError;
    const err=$('#ferror');if(err){err.hidden=!issue;err.textContent=issue||''}
    const blocked=locked||saving||!!issue;
    const send=$('#send'),draft=$('#mkdraft');
    if(send)send.disabled=blocked||!latestPlan?.plan.toSend;
    if(draft)draft.disabled=blocked||!latestPlan?.supportsDrafts||!latestPlan?.plan.toDraft;
    const test=$('#test');if(test)test.disabled=archived||saving||!!issue;
    const count=$('#fcount');if(count&&latestPlan)count.textContent=issue?'Sending is blocked until the rules are fixed.':saving?'Saving recipient rules…':`${latestPlan.plan.filteredOut||0} of ${latestPlan.plan.contacts} contacts excluded by these rules; ${latestPlan.plan.toSend} emails ready to send.`;
  }
  function drawFilter(){
    const box=$('#filterbox');
    if(!F.conditions.length){
      box.innerHTML=`<h3>Recipient rules</h3><p class="mute small">Everyone on the selected list is included, except people marked don't email, opted out, or with invalid addresses.</p>
       ${locked?'':`<button class="btn" id="faddfirst" ${filterCols.length?'':'disabled'}>+ Select recipients using column values</button>`}<div class="note bad" id="ferror" hidden></div>`;
      const b=$('#faddfirst');if(b)b.onclick=()=>{F.conditions.push(newCondition());drawFilter();dirty()};
      updateFilterState();
      return;
    }
    box.innerHTML=`<h3>Recipient rules · Only send to people where
      <select id="fmatch" aria-label="Match recipient rules" style="width:auto;display:inline-block" ${locked?'disabled':''}><option value="all">all (AND)</option><option value="any">any (OR)</option></select>
      of these are true</h3>
     ${F.conditions.map((x,i)=>`<div class="row" style="margin-bottom:6px" data-fi="${i}">
       <select class="fcol" aria-label="Rule ${i+1} column" style="width:auto;min-width:160px" ${locked?'disabled':''}>${[...new Set([x.column,...filterCols])].filter(Boolean).map(k=>`<option ${k===x.column?'selected':''}>${esc(k)}</option>`).join('')}</select>
       <select class="fop" aria-label="Rule ${i+1} comparison" style="width:auto" ${locked?'disabled':''}>${Object.entries(FILTER_OPS).map(([v,l])=>`<option value="${v}" ${v===x.operator?'selected':''}>${l}</option>`).join('')}</select>
       <input class="fval" aria-label="Rule ${i+1} value" value="${esc(x.value||'')}" placeholder="value" style="max-width:200px;display:${FILTER_NEEDS_VALUE.includes(x.operator)?'':'none'}" ${locked?'disabled':''}>
       ${locked?'':'<button class="btn danger fdel" title="Remove condition">✕</button>'}</div>`).join('')}
     ${locked?'':`<div class="row"><button class="btn" id="fadd" ${F.conditions.length>=10||!filterCols.length?'disabled':''}>+ Add condition</button><a href="#" id="fclear" class="small">Send to everyone instead</a></div>`}
     <p class="mute small">Yes includes TRUE, yes, y, t, 1, x, ✓ and ✔. Blank and other values count as not true. These rules apply to this email; contacts who don't match are skipped automatically.</p>
     <div class="note bad" id="ferror" hidden></div>
     <p class="mute small" id="fcount"></p>`;
    $('#fmatch').value=F.match;
    $('#fmatch').onchange=e=>{F.match=e.target.value;dirty()};
    $$('[data-fi]').forEach(row=>{const x=F.conditions[+row.dataset.fi];
      $('.fcol',row).onchange=e=>{x.column=e.target.value;dirty()};
      $('.fop',row).onchange=e=>{x.operator=e.target.value;$('.fval',row).style.display=FILTER_NEEDS_VALUE.includes(x.operator)?'':'none';dirty()};
      $('.fval',row).oninput=e=>{x.value=e.target.value;dirty()};
      const del=$('.fdel',row);if(del)del.onclick=()=>{F.conditions.splice(+row.dataset.fi,1);drawFilter();dirty()};
    });
    const add=$('#fadd');if(add)add.onclick=()=>{if(F.conditions.length<10){F.conditions.push(newCondition());drawFilter();dirty()}};
    const clr=$('#fclear');if(clr)clr.onclick=e=>{e.preventDefault();F.conditions=[];drawFilter();dirty()};
    updateFilterState();
  }
  drawFilter();
  const fields=()=>({subject:$('#subject').value,body:getBody(),isHtml,unsubscribeFooter:$('#unsub').checked,unsubscribeMessage:$('#unsubMessage').value,includeBusinessFooter:$('#businessFooter').checked,useWorkspaceBusinessFooter:$('#businessFooterSource').value==='workspace',businessFooter:businessFooterValue('email_footer'),accountId:+$('#account').value||null,listId:+$('#list').value||null,filter:filterOut()});
  let saves=Promise.resolve();
  const persist=async()=>{
    if(locked)return;
    const issue=filterIssue();if(issue)throw new Error(issue);
    const body=fields(),signature=JSON.stringify(body);
    // A failed save is reported to its caller; the next edit can still retry the queue.
    const request=saves.catch(()=>null).then(()=>api('PUT','/api/campaigns/'+id,body));saves=request;
    try{await request}catch(e){if(signature===JSON.stringify(fields())){serverFilterError=e.message;$('#saved').textContent='Not saved';updateFilterState()}throw e}
    if(signature===JSON.stringify(fields())){saving=false;serverFilterError=null;$('#saved').textContent='Saved'}
    updateFilterState();
  };
  const save=debounce(guard(async()=>{await persist();await refreshPlan()}),700);
  const dirty=()=>{saving=true;$('#saved').textContent=filterIssue()?'Rules incomplete':'Saving…';updateFilterState();if(!filterIssue())save()};
  $('#subject').oninput=dirty;plain.oninput=dirty;ed.oninput=dirty;$('#unsubMessage').oninput=dirty;
  $('#unsub').onchange=()=>{$('#unsubOptions').hidden=!$('#unsub').checked;dirty()};
  const showFooter=()=>{
    $('#businessFooterOptions').hidden=!$('#businessFooter').checked;
    $('#businessFooterCustom').hidden=$('#businessFooterSource').value==='workspace';
    $('#businessFooterDefault').hidden=$('#businessFooterSource').value!=='workspace';
  };
  $('#businessFooterSource').value=c.useWorkspaceBusinessFooter===false?'custom':'workspace';showFooter();
  $('#businessFooter').onchange=()=>{showFooter();dirty()};$('#businessFooterSource').onchange=()=>{showFooter();dirty()};
  wireBusinessFooter('email_footer',c.businessFooter??WS.workspace.businessFooter,dirty);
  $('#account').onchange=guard(async()=>{await persist();editEmail(id)});
  $('#list').onchange=guard(async()=>{await persist();editEmail(id)});
  fmt.onchange=()=>{const want=fmt.value==='1';if(want===isHtml)return;
    if(want){ed.innerHTML=esc(plain.value).replace(/\n/g,'<br>')}else{const t=document.createElement('div');t.innerHTML=ed.innerHTML.replace(/<br\s*\/?>|<\/(p|div|li)>/gi,'\n');plain.value=t.textContent.replace(/\n{3,}/g,'\n\n').trim()}
    isHtml=want;showMode();dirty()};
  $$('[data-cmd]').forEach(b=>b.onmousedown=e=>{e.preventDefault();const cmd=b.dataset.cmd;if(cmd==='createLink'){const u=prompt('Link address (https://…)');if(u)document.execCommand(cmd,false,u)}else document.execCommand(cmd);dirty()});
  let lastFocus='plain';['subject','plain','editor'].forEach(i=>$('#'+i).addEventListener('focus',()=>lastFocus=i));
  $$('.chip').forEach(b=>b.onmousedown=e=>{e.preventDefault();if(locked)return;const tag=`{{${b.dataset.f}}}`;
    const target=lastFocus==='subject'?$('#subject'):(isHtml?ed:plain);
    if(target===ed){ed.focus();document.execCommand('insertText',false,tag)}
    else{target.focus();const s=target.selectionStart??target.value.length;target.setRangeText(tag,s,target.selectionEnd??s,'end')}dirty()});
  $('#back').onclick=()=>{EM.cur=null;clearInterval(poller);poller=null;viewEmails()};
  $('#copy').onclick=guard(async()=>{const r=await api('POST',`/api/campaigns/${id}/copy`);EM.cur=r.id;toast('Copied');editEmail(r.id)});
  $('#del').onclick=guard(async()=>{if(confirm('Delete this email? Messages already sent stay in the mailbox.')){await api('DELETE','/api/campaigns/'+id);EM.cur=null;viewEmails()}});
  const addAtt=$('#addAtt');if(addAtt)addAtt.onclick=()=>pickFile('*/*',guard(async f=>{const fd=new FormData();fd.append('file',f);toast('Uploading…');const r=await api('POST',`/api/campaigns/${id}/attachments`,undefined,fd);if(r.totalBytes>20*1048576)toast(`Attachments now total ${fmtSize(r.totalBytes)}. Many mail servers refuse emails over about 20 MB.`,true);editEmail(id)}));
  $$('[data-att]').forEach(b=>b.onclick=guard(async()=>{await api('DELETE',`/api/campaigns/${id}/attachments/${b.dataset.att}`);editEmail(id)}));
  $('#prev').onclick=guard(async()=>{await persist();showPreview(id)});
  $('#test').onclick=guard(async()=>{await persist();const r=await api('POST',`/api/campaigns/${id}/test`,{to:$('#testTo').value});toast(r.message)});

  // --- run card
  async function refreshPlan(){
    const [cur,p]=await Promise.all([api('GET','/api/campaigns/'+id),api('GET',`/api/campaigns/${id}/plan`)]);
    latestPlan=p;serverFilterError=p.filterError;
    const plan=p.plan,n=cur.counts,tot=n.total||0,seg=(k,col)=>tot?`<i style="width:${(n[k]||0)/tot*100}%;background:${col}"></i>`:'';
    const running=cur.status==='running';
    $('#runcard').innerHTML=`<h2>4 · Create drafts or send</h2>
     ${archived?'':`<div class="note small">Before sending commercial email, check recipient consent and include your business name, contact details and a working unsubscribe option. Honour unsubscribe requests within five working days. Sending slowly or sending fewer emails doesn't replace these requirements.
      ${cur.unsubscribeFooter?'':'<br><b>The automatic unsubscribe link is off.</b> Enable it above or provide another working unsubscribe option.'}
      <a href="https://www.dia.govt.nz/Spam-Three-Steps" target="_blank" rel="noopener noreferrer">NZ anti-spam guidance</a></div>`}
     ${p.filterError?`<div class="note bad">${esc(p.filterError)}</div>`:''}
     ${cur.note?`<div class="note bad">${esc(cur.note)}</div>`:''}
     ${tot?`<div class="row" style="margin-bottom:8px">${[['sent','Sent'],['drafted','Drafts'],['pending','Waiting'],['failed','Failed'],['uncertain','Check'],['skipped','Skipped']].map(([k,l])=>`<div class="stat"><b>${n[k]||0}</b>${l}</div>`).join('')}</div>
      <div class="bar-progress">${seg('sent','var(--ok)')}${seg('drafted','var(--brand)')}${seg('uncertain','var(--warn)')}${seg('failed','var(--bad)')}</div>`:''}
     ${n.uncertain?`<div class="note">${n.uncertain} email(s) might or might not have gone out. Check the account's Sent Items, then open <b>View log</b> to mark each one as sent or retry it.</div>`:''}
     ${archived?'':`<div class="row" style="margin-top:12px">
      ${running?`<button class="btn primary" id="pause">⏸ Pause</button>`:`
       <button class="btn" id="mkdraft" ${p.supportsDrafts&&plan.toDraft?'':'disabled'} title="${p.supportsDrafts?'':'This account type can’t save drafts'}">📝 Create ${plan.toDraft||0} drafts in my mailbox</button>
       <button class="btn primary" id="send" ${plan.toSend?'':'disabled'}>✉ Send ${plan.toSend||0} emails</button>`}
      ${n.failed?`<button class="btn" id="retry">Retry ${n.failed} failed</button>`:''}
      ${tot?`<a class="btn" href="/api/campaigns/${id}/log.csv">⬇ Download log</a><button class="btn" id="logbtn">View log</button>`:''}</div>
     <p class="mute small">${plan.filteredOut?`${plan.filteredOut} contact(s) don't match this email's filter. `:''}${plan.skipped-plan.filteredOut?`${plan.skipped-plan.filteredOut} contact(s) will be skipped (invalid, marked “don't email”, or opted out). `:''}${plan.alreadySent?`${plan.alreadySent} already sent. `:''}Drafts appear in the Drafts folder of <b>${esc(p.fromEmail||p.account||'the account')}</b> so you can read and edit them in Outlook; sending puts each email in <b>Sent</b>.</p>`}<div id="log"></div>`;
    if(running){$('#pause').onclick=guard(async()=>{await api('POST',`/api/campaigns/${id}/pause`);editEmail(id)});if(!poller)poller=setInterval(()=>refreshPlan().catch(()=>0),2500)}
    else if(poller){clearInterval(poller);poller=null;if(cur.status==='done')toast('Finished');editEmail(id);return}
    const go=guard(async mode=>{await persist();
      const q=(await api('GET',`/api/campaigns/${id}/plan`));const pl=q.plan,who=q.fromEmail||q.account;
      const msg=mode==='send'?`Send ${pl.toSend} real emails from ${who}?\n\nThey go out one by one at a gentle pace and can't be recalled. Tip: send yourself a test first.`
        :`Create ${pl.toDraft} drafts in ${who}'s Drafts folder?\n\nNothing is sent. You can review each one in Outlook.`;
      if(!confirm(msg))return;await api('POST',`/api/campaigns/${id}/run`,{mode});editEmail(id)});
    if($('#send'))$('#send').onclick=()=>go('send');if($('#mkdraft'))$('#mkdraft').onclick=()=>go('draft');
    if($('#retry'))$('#retry').onclick=guard(async()=>{const r=await api('POST',`/api/campaigns/${id}/retry-failed`);toast(`${r.requeued} ready to try again. Press Send or Create drafts.`);refreshPlan()});
    if($('#logbtn'))$('#logbtn').onclick=guard(()=>showLog(id));
    updateFilterState();
  }
  await refreshPlan();
}
async function showPreview(id,cid){
  const r=await api('GET',`/api/campaigns/${id}/preview${cid?'?contactId='+cid:''}`);
  modal(`<div class="row"><h2 style="margin:0">Preview</h2><span class="mute small">${r.total?`Contact ${esc(r.to)}`:'No contacts in this list'}</span>
   <span class="right row"><button class="btn" id="pv" ${r.previousId?'':'disabled'}>←</button><button class="btn" id="nx" ${r.nextId?'':'disabled'}>→</button></span></div>
   ${r.unknownFields.length?`<div class="note bad">These {{fields}} aren't columns in your list and will be blank: ${r.unknownFields.map(esc).join(', ')}</div>`:''}
   ${r.emptyFields.length?`<div class="note">This contact has nothing in: ${r.emptyFields.map(esc).join(', ')}</div>`:''}
   <label>To</label><div>${esc(r.to)}</div><label>Subject</label><div><b>${esc(r.subject)}</b></div><label>Message</label>
   ${r.isHtml?'<iframe sandbox id="fr"></iframe>':`<div style="white-space:pre-wrap;border:1px solid var(--line);border-radius:8px;padding:10px">${esc(r.body)}</div>`}
   <div class="row" style="margin-top:14px"><button class="btn" onclick="closeModal()">Close</button></div>`);
  if(r.isHtml)$('#fr').srcdoc=r.body;
  $('#pv').onclick=()=>showPreview(id,r.previousId);$('#nx').onclick=()=>showPreview(id,r.nextId);
}
async function showLog(id){
  const ms=await api('GET',`/api/campaigns/${id}/messages?limit=5000`);
  const pill=s=>`<span class="pill ${s==='sent'?'ok':s==='failed'?'bad':s==='uncertain'||s==='skipped'?'warn':''}">${s==='uncertain'?'check':s}</span>`;
  modal(`<h2>Log</h2><div class="gridwrap"><table><tbody>${ms.map(m=>`<tr><td class="pad">${esc(m.email)}</td><td class="pad">${pill(m.status)}</td><td class="pad small mute" style="white-space:normal">${esc(m.error||'')}</td>
   <td class="pad">${m.status==='uncertain'?`<button class="btn" data-m="${m.id}" data-s="sent">It was sent</button> <button class="btn" data-m="${m.id}" data-s="pending">Retry</button>`:''}</td></tr>`).join('')}</tbody></table></div>
   <div class="row" style="margin-top:14px"><button class="btn" onclick="closeModal()">Close</button></div>`);
  $$('[data-m]').forEach(b=>b.onclick=guard(async()=>{await api('POST',`/api/campaigns/${id}/messages/${b.dataset.m}/mark`,{status:b.dataset.s});showLog(id)}));
}

start().catch(e=>toast(e.message,true));
</script>
</body>
