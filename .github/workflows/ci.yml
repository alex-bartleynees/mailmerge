name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      # SharedKernel.* restores from GitHub Packages (see nuget.config).
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node for UI tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test recipient rule UI
        run: |
          npm ci --prefix tests/MailMerge.UiTests
          npm test --prefix tests/MailMerge.UiTests

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MailMerge.slnx

      # ubuntu-latest ships Docker, which Testcontainers uses for Postgres and GreenMail (SMTP/IMAP).
      - name: Test
        run: >
          dotnet test MailMerge.slnx
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"
          if-no-files-found: ignore
