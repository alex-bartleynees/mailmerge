name: Build and Deploy with Helm

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node for UI tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test recipient rule UI
        run: |
          npm ci --prefix tests/MailMerge.UiTests
          npm test --prefix tests/MailMerge.UiTests

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MailMerge.slnx

      - name: Test
        run: >
          dotnet test MailMerge.slnx
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"
          if-no-files-found: ignore

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate build ID
        id: tag
        run: echo "build_id=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          secrets: |
            github_packages_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            creativefree/mailmerge-api:latest
            creativefree/mailmerge-api:${{ steps.tag.outputs.build_id }}

      - name: Set Git user info
        run: |
          git config --global user.email "${{ secrets.GIT_EMAIL }}"
          git config --global user.name "${{ secrets.GIT_NAME }}"

      # Argo CD deploys whatever tag is committed here (pushes made with GITHUB_TOKEN don't re-trigger workflows).
      - name: Update values.yaml with build tag
        run: |
          # Quote the SHA: tags such as 2730e53 otherwise parse as YAML numbers.
          sed -i "s/^  tag: .*/  tag: \"${{ steps.tag.outputs.build_id }}\"/" deployment/helm-charts/mailmerge-api/values.yaml
          git add deployment/helm-charts/mailmerge-api/values.yaml
          git commit -m "Update image tag to ${{ steps.tag.outputs.build_id }}"
          git push origin main
