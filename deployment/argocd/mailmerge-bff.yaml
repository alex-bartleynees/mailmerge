# Copy into portfolio-cluster/components/applications/ and add to its kustomization.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mailmerge-bff
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/alex-bartleynees/authgateway-bff.git
      path: deployment/helm-charts/authgateway-bff
      targetRevision: HEAD
      helm:
        valueFiles:
          - values.yaml
          - values-mailmerge.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: mailmerge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
