namespace: "mailmerge"

image:
  repository: creativefree/mailmerge-api
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Exactly one instance: the delivery worker's startup recovery assumes no other worker is mid-send, and
# "Recreate" makes sure the old pod is gone before the new one starts.
replicaCount: 1

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1654
  fsGroup: 1654

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    memory: "160Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 10
  failureThreshold: 3

config:
  # The browser-facing address (the BFF ingress). Used in unsubscribe links and the Microsoft sign-in redirect.
  publicBaseUrl: "https://mailmerge.alexbartleynees.com"
  otlpEndpoint: "http://my-collector-collector.monitoring.svc.cluster.local:4317"
  maxUploadMegabytes: "25"

database:
  secretName: "mailmerge-db-secret"
  connectionStringKey: "CONNECTION_STRING"

auth:
  authority: "https://identity.alexbartleynees.com/realms/mailmerge"
  audience: "mailmerge-api"
  roleClientId: "mailmerge"
  requiredRole: "mailmerge-user"
  workspaceGroupPrefix: "/mailmerge/"

# Entra (Azure AD) app registration used to reach shop Microsoft 365 mailboxes.
microsoft:
  tenant: "organizations"
  secretName: "mailmerge-microsoft"
  clientIdKey: "CLIENT_ID"
  clientSecretKey: "CLIENT_SECRET"
