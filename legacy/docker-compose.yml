services:
  mailmerge:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"          # put this behind your reverse proxy / Tailscale, not the open internet
    volumes:
      - ./data:/data         # database, attachments, sign-in tokens: back this up
    environment:
      APP_PASSWORD: "change-me"          # simple password prompt for the web page (leave blank to disable)
      GRAPH_CLIENT_ID: ""                # Azure app (client) ID, see README
      GRAPH_TENANT: "common"
